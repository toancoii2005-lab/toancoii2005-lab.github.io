<!doctype html>
<html lang="en" data-bs-theme="light">
    <head>
        <title>Title</title>
        <!-- Required meta tags -->
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />

        <!-- Bootstrap CSS v5.3.8 -->
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
            crossorigin="anonymous"
        />
    </head>

    <body>
        <header>
            <!-- place navbar here -->
        </header>
        <main>
            <div class="container bg-white p-4 rounded shadow-sm" style="max-width: 700px;">
    <h3 class="mb-4 pb-2 border-bottom">Bài 3.2: Tạo button group theo mẫu</h3>

    <!-- a) Button group cơ bản -->
    <section class="mb-5">
      <h5 class="mb-3">a) Group menu điều hướng</h5>
      <div class="btn-group" role="group" aria-label="Basic example">
        <button type="button" class="btn btn-primary px-4">Home</button>
        <button type="button" class="btn btn-primary px-4">About</button>
        <button type="button" class="btn btn-primary px-4">Services</button>
      </div>
    </section>

    <!-- b) Button group chứa Icon -->
    <section class="mb-5">
      <h5 class="mb-3">b) Group chứa icon thao tác</h5>
      <div class="btn-group" role="group" aria-label="Button group with icons">
        <button type="button" class="btn btn-primary px-3">
          <i class="bi bi-eye"></i> View
        </button>
        <button type="button" class="btn btn-primary px-3">
          <i class="bi bi-pencil"></i> Edit
        </button>
        <button type="button" class="btn btn-primary px-3">
          <i class="bi bi-trash"></i> Delete
        </button>
      </div>
    </section>

    <!-- c) Toolbar định dạng văn bản -->
    <section class="mb-3">
      <h5 class="mb-3">c) Thanh công cụ định dạng văn bản (Toolbar)</h5>
      <div class="btn-toolbar gap-2" role="toolbar" aria-label="Toolbar with button groups">
        <!-- Nhóm kiểu chữ -->
        <div class="btn-group" role="group" aria-label="Font style group">
          <button type="button" class="btn btn-primary fw-bold px-3">T</button>
          <button type="button" class="btn btn-primary fw-bold px-3">B</button>
          <button type="button" class="btn btn-primary fst-italic px-3">I</button>
          <button type="button" class="btn btn-primary text-decoration-underline px-3">U</button>
        </div>

        <!-- Nhóm căn chỉnh lề -->
        <div class="btn-group" role="group" aria-label="Alignment group">
          <button type="button" class="btn btn-primary"><i class="bi bi-text-left"></i></button>
          <button type="button" class="btn btn-primary"><i class="bi bi-text-center"></i></button>
          <button type="button" class="btn btn-primary"><i class="bi bi-text-right"></i></button>
          <button type="button" class="btn btn-primary"><i class="bi bi-justify"></i></button>
        </div>

        <!-- Nhóm xem code -->
        <div class="btn-group" role="group" aria-label="Code group">
          <button type="button" class="btn btn-primary"><i class="bi bi-code-slash"></i></button>
        </div>
      </div>
    </section>

  </div>
        </main>
        <footer>
            <!-- place footer here -->
        </footer>
        <!-- Bootstrap JavaScript Bundle (includes Popper) -->
        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"
        ></script>
    </body>
</html>
