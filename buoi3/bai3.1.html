<!doctype html>
<html lang="en" data-bs-theme="light">
    <head>
        <title>Bài 3.1</title>
        <!-- Required meta tags -->
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />

        <!-- Bootstrap CSS v5.3.8 -->
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
            crossorigin="anonymous"
        />
    </head>

    <body>
        <header>
            <!-- place navbar here -->
        </header>
        <main>
            <div class="container bg-white p-4 rounded shadow-sm">
    <!-- a) Định nghĩa các class buttons -->
    <section class="mb-5">
      <h4 class="mb-3">a) Định nghĩa các class buttons</h4>
      <div class="d-flex flex-wrap gap-2">
        <button type="button" class="btn btn-secondary">Default Button</button>
        <button type="button" class="btn btn-primary">Primary Button</button>
        <button type="button" class="btn btn-success">Success Button</button>
        <button type="button" class="btn btn-info text-white">Info Button</button>
        <button type="button" class="btn btn-warning text-white">Warning Button</button>
        <button type="button" class="btn btn-danger">Danger Button</button>
        <a href="#" class="btn btn-link">Link Button</a>
      </div>
    </section>

    <!-- b) Button với đường viền -->
    <section class="mb-5">
      <h4 class="mb-3">b) Button với đường viền</h4>
      <div class="d-flex flex-wrap gap-2">
        <button type="button" class="btn btn-outline-primary">Primary</button>
        <button type="button" class="btn btn-outline-secondary">Secondary</button>
        <button type="button" class="btn btn-outline-success">Success</button>
        <button type="button" class="btn btn-outline-info">Info</button>
        <button type="button" class="btn btn-outline-warning">Warning</button>
        <button type="button" class="btn btn-outline-danger">Danger</button>
        <button type="button" class="btn btn-outline-dark">Dark</button>
        <button type="button" class="btn btn-outline-light text-dark">Light</button>
      </div>
    </section>

    <!-- c) Kích thước của button -->
    <section class="mb-5">
      <h4 class="mb-3">c) Kích thước của button</h4>
      <div class="d-flex flex-wrap align-items-center gap-2">
        <button type="button" class="btn btn-secondary btn-lg">Nút to</button>
        <button type="button" class="btn btn-secondary">Kích thước mặc định</button>
        <button type="button" class="btn btn-secondary btn-sm">Nút nhỏ</button>
      </div>
    </section>

    <!-- d) Thành phần của Button -->
    <section class="mb-5">
      <h4 class="mb-3">d) Thành phần của Button</h4>
      <div class="d-flex flex-wrap gap-2">
        <a href="#" class="btn btn-secondary">Button chứa link</a>
        <button type="button" class="btn btn-secondary">Button</button>
        <input type="button" class="btn btn-secondary" value="Input Button">
        <input type="submit" class="btn btn-secondary" value="Submit Button">
      </div>
    </section>

    <!-- e) Trạng thái của nút -->
    <section class="mb-5">
      <h4 class="mb-3">e) Trạng thái của nút</h4>
      <div class="d-flex flex-wrap gap-2">
        <button type="button" class="btn btn-secondary">Nút bình thường</button>
        <button type="button" class="btn btn-secondary active">Nút có thể click</button>
        <button type="button" class="btn btn-secondary" disabled>Nút không thể click</button>
        <a href="#" class="btn btn-secondary disabled" tabindex="-1" aria-disabled="true">Link không thể click</a>
      </div>
    </section>

    <!-- f) Nút đang load -->
    <section class="mb-3">
      <h4 class="mb-1">f) Nút đang load</h4>
      <p class="text-muted small mb-3">Thêm trạng thái đang load cho nút:</p>
      <div class="d-flex flex-wrap gap-2">
        <!-- Nút chỉ có Spinner -->
        <button class="btn btn-secondary" type="button" disabled>
          <span class="spinner-border spinner-border-sm" aria-hidden="true"></span>
          <span class="visually-hidden">Loading...</span>
        </button>

        <!-- Nút Spinner tròn xoay + chữ Loading -->
        <button class="btn btn-secondary" type="button" disabled>
          <span class="spinner-border spinner-border-sm" aria-hidden="true"></span>
          <span role="status"> Loading...</span>
        </button>

        <!-- Nút Spinner nhấp nháy + chữ Loading -->
        <button class="btn btn-secondary" type="button" disabled>
          <span class="spinner-grow spinner-grow-sm" aria-hidden="true"></span>
          <span role="status"> Loading...</span>
        </button>

        <!-- Nút chữ Loading (dạng tùy chỉnh tĩnh) -->
        <button class="btn btn-secondary" type="button" disabled>
          Loading...
        </button>
      </div>
    </section>

  </div>
        </main>
        <footer>
            <!-- place footer here -->
        </footer>
        <!-- Bootstrap JavaScript Bundle (includes Popper) -->
        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"
        ></script>
    </body>
</html>
