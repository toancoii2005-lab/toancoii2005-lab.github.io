<!doctype html>
<html lang="en" data-bs-theme="light">
    <head>
        <title>Title</title>
        <!-- Required meta tags -->
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />

        <!-- Bootstrap CSS v5.3.8 -->
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
            crossorigin="anonymous"
        />
    </head>

    <body>
        <header>
            <!-- place navbar here -->
        </header>
        <main>
            <div class="container bg-white p-4 rounded shadow-sm" style="max-width: 700px;">
    <h2 class="mb-4 pb-2 border-bottom fw-bold">Registration Form</h2>

    <form>
      <!-- First Name -->
      <div class="row mb-3 align-items-center">
        <label for="firstName" class="col-sm-3 col-form-label fw-semibold">First Name:</label>
        <div class="col-sm-9">
          <input type="text" class="form-control" id="firstName" placeholder="First Name">
        </div>
      </div>

      <!-- Last Name -->
      <div class="row mb-3 align-items-center">
        <label for="lastName" class="col-sm-3 col-form-label fw-semibold">Last Name:</label>
        <div class="col-sm-9">
          <input type="text" class="form-control" id="lastName" placeholder="Last Name">
        </div>
      </div>

      <!-- Email Address -->
      <div class="row mb-3 align-items-center">
        <label for="regEmail" class="col-sm-3 col-form-label fw-semibold">Email Address:</label>
        <div class="col-sm-9">
          <input type="email" class="form-control" id="regEmail" placeholder="Email Address">
        </div>
      </div>

      <!-- Mobile Number -->
      <div class="row mb-3 align-items-center">
        <label for="mobileNumber" class="col-sm-3 col-form-label fw-semibold">Mobile Number:</label>
        <div class="col-sm-9">
          <input type="tel" class="form-control" id="mobileNumber" placeholder="Phone Number">
        </div>
      </div>

      <!-- Date of Birth -->
      <div class="row mb-3 align-items-center">
        <label class="col-sm-3 col-form-label fw-semibold">Date of Birth:</label>
        <div class="col-sm-9">
          <div class="row g-2">
            <div class="col">
              <select class="form-select">
                <option selected disabled>Date</option>
                <!-- Ví dụ các ngày -->
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
              </select>
            </div>
            <div class="col">
              <select class="form-select">
                <option selected disabled>Month</option>
                <option value="1">January</option>
                <option value="2">February</option>
              </select>
            </div>
            <div class="col">
              <select class="form-select">
                <option selected disabled>Year</option>
                <option value="2026">2026</option>
                <option value="2025">2025</option>
              </select>
            </div>
          </div>
        </div>
      </div>

      <!-- Postal Address -->
      <div class="row mb-3 align-items-center">
        <label for="postalAddress" class="col-sm-3 col-form-label fw-semibold">Postal Address:</label>
        <div class="col-sm-9">
          <textarea class="form-control" id="postalAddress" rows="3" placeholder="Postal Address"></textarea>
        </div>
      </div>

      <!-- Zip Code -->
      <div class="row mb-3 align-items-center">
        <label for="zipCode" class="col-sm-3 col-form-label fw-semibold">Zip Code:</label>
        <div class="col-sm-9">
          <input type="text" class="form-control" id="zipCode" placeholder="Zip Code">
        </div>
      </div>

      <!-- Upload Image -->
      <div class="row mb-3 align-items-center">
        <label for="uploadImage" class="col-sm-3 col-form-label fw-semibold">Upload Image:</label>
        <div class="col-sm-9">
          <input class="form-control" type="file" id="uploadImage">
        </div>
      </div>

      <!-- Gender -->
      <div class="row mb-3 align-items-center">
        <label class="col-sm-3 col-form-label fw-semibold">Gender:</label>
        <div class="col-sm-9">
          <div class="form-check form-check-inline">
            <input class="form-check-input" type="radio" name="gender" id="genderMale" value="male">
            <label class="form-check-label" for="genderMale">Male</label>
          </div>
          <div class="form-check form-check-inline">
            <input class="form-check-input" type="radio" name="gender" id="genderFemale" value="female">
            <label class="form-check-label" for="genderFemale">Female</label>
          </div>
        </div>
      </div>

      <!-- Agree Terms -->
      <div class="row mb-3">
        <div class="col-sm-9 offset-sm-3">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="agreeTerms">
            <label class="form-check-label" for="agreeTerms">
              I agree to the <a href="#">Terms and Conditions</a>
            </label>
          </div>
        </div>
      </div>

      <!-- Buttons -->
      <div class="row">
        <div class="col-sm-9 offset-sm-3 d-flex gap-2">
          <button type="submit" class="btn btn-primary">Submit</button>
          <button type="reset" class="btn btn-secondary">Reset</button>
        </div>
      </div>
    </form>
  </div>
        </main>
        <footer>
            <!-- place footer here -->
        </footer>
        <!-- Bootstrap JavaScript Bundle (includes Popper) -->
        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"
        ></script>
    </body>
</html>
