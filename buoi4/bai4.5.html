<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bài 4.5 - Responsive Navbar</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>
  <div class="container mt-4">
    <nav class="navbar navbar-expand-lg navbar-light bg-light rounded border p-2">
      <div class="container-fluid">
        <a class="navbar-brand text-secondary fs-4" href="#">
          <i class="bi bi-browser-chrome"></i> 
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarBai45">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarBai45">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item">
              <a class="nav-link" href="#">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#">Profile</a>
            </li>
            <li class="nav-item dropdown">
              <a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown">
                Messages
              </a>
              <ul class="dropdown-menu">
                <li><a class="dropdown-item" href="#">Inbox</a></li>
                <li><a class="dropdown-item" href="#">Sent</a></li>
              </ul>
            </li>
          </ul>
          <form class="d-flex mb-2 mb-lg-0">
            <input class="form-control form-control-sm me-2 bg-white" type="search" placeholder="Search">
            <button class="btn btn-dark btn-sm px-3" type="submit"><i class="bi bi-search"></i></button>
          </form>
          <ul class="navbar-nav ms-lg-3">
            <li class="nav-item">
              <a class="nav-link" href="#">Login</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
