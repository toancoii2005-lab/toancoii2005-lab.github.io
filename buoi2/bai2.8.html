        <style>
    .context-link {
        color: black;
        transition: color 0.2s;
    }
    .context-link.primary:hover {
        color: #0d6efd;
    }
    .context-link.success:hover {
        color: #198754;
    }
    .context-link.info:hover {
        color: #0dcaf0;
    }
    .context-link.warning:hover {
        color: #ffc107;
    }
    .context-link.danger:hover {
        color: #dc3545;
    }
</style>

    <body>
        <header>

            <h1>màu sắc theo link ngữ cảnh</h1>
            <p>di chuột qua các liên kết để thấy màu sắc thay đổi theo ngữ cảnh:</p>
            <ul>
                <li><a href="#" class="context-link primary">Liên kết chính</a></li>
                <li><a href="#" class="context-link success">Liên kết thành công</a></li>
                <li><a href="#" class="context-link info">Liên kết thông tin</a></li>
                <li><a href="#" class="context-link warning">Liên kết cảnh báo</a></li>
                <li><a href="#" class="context-link danger">Liên kết nguy hiểm</a></li>
