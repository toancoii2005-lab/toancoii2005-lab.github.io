<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 2.3 - Căn chỉnh hình ảnh</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .demo-box {
            border: 1px solid #ccc;
            padding: 10px;
            margin-bottom: 20px;
            background-color: #f9f9f9;
        }
    </style>
</head>
<body class="p-4">

    <h4>Bài 2.3: Căn chỉnh hình ảnh theo mẫu</h4>
    
    <div class="demo-box">
        <p class="text-muted mb-1"><code>left alignment (This is default)</code></p>
        <div>
            <img src="anh1.jpg" class="img-fluid" alt="Left alignment" width="200px" height="200">
        </div>
    </div>

    <div class="demo-box text-center">
        <p class="text-muted mb-1"><code>Center alignment using text alignment classes</code></p>
        <div>
            <img src="anh1.jpg" class="img-fluid" alt="Center alignment" width="200px" height="200">
        </div>
    </div>

    <div class="demo-box text-end">
        <p class="text-muted mb-1"><code>Right alignment using text alignment classes</code></p>
        <div>
            <img src="anh1.jpg" class="img-fluid" alt="Right alignment" width="200px" height="200">
        </div>
    </div>

    <div class="demo-box clearfix">
        <p class="text-muted mb-1"><code>Horizontal alignment using float classes</code></p>
        <img src="anh1.jpg" class="float-start img-fluid" alt="Float Start" width="200px" height="200">
        <img src="anh1.jpg" class="float-end img-fluid" alt="Float End" width="200px" height="200">
    </div>

    <div class="demo-box">
        <p class="text-muted mb-1"><code>Center alignment of block-level image using auto margin</code></p>
        <div>
            <img src="anh1.jpg" class="d-block mx-auto img-fluid" alt="Block Center Auto Margin" width="200px" height="200">
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
